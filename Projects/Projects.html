    <div class="project-view-switcher" role="group" aria-label="Project view">
        <button class="view-switch is-active" type="button" data-view="grid" aria-pressed="true">Grid</button>
        <button class="view-switch" type="button" data-view="archive" aria-pressed="false">Archive</button>
    </div>

    <script>
    (function(){
        const desktopQuery = window.matchMedia('(min-width: 1100px)');
        const grid = document.querySelector('.desktop-grid-view');
        const archive = document.querySelector('.desktop-project-index');
        const rows = Array.from(archive.querySelectorAll('.project-index-row'));
        const switches = Array.from(document.querySelectorAll('.view-switch'));

        rows.forEach((row) => {
            const title = row.querySelector('.project-index-title');
            const titleLink = title.querySelector('a');
            const image = row.querySelector('.project-thumbnails img');
            const imageLink = image.closest('a');
            const project = document.createElement('article');
            project.className = 'grid-project';

            const media = imageLink ? document.createElement('a') : document.createElement('div');
            media.className = 'grid-project-media';
            if (imageLink) media.href = imageLink.getAttribute('href');

            const featuredImage = image.cloneNode();
            featuredImage.removeAttribute('width');
            featuredImage.removeAttribute('height');
            media.appendChild(featuredImage);

            const info = document.createElement('div');
            info.className = 'grid-project-info';
            const name = titleLink ? document.createElement('a') : document.createElement('span');
            name.className = 'grid-project-name';
            name.textContent = title.textContent.trim();
            if (titleLink) name.href = titleLink.getAttribute('href');
            const meta = document.createElement('span');
            meta.className = 'grid-project-meta';
            meta.textContent = row.dataset.meta || '';
            info.append(name, meta);
            project.append(media, info);
            grid.appendChild(project);
        });

        function setView(view) {
            const showGrid = view === 'grid';
            grid.classList.toggle('is-active', showGrid);
            archive.classList.toggle('is-active', !showGrid);
            grid.setAttribute('aria-hidden', String(!showGrid));
            archive.setAttribute('aria-hidden', String(showGrid));
            switches.forEach((button) => {
                const active = button.dataset.view === view;
                button.classList.toggle('is-active', active);
                button.setAttribute('aria-pressed', String(active));
            });
            window.scrollTo(0, 0);
        }

        switches.forEach((button) => button.addEventListener('click', () => setView(button.dataset.view)));
        if (desktopQuery.matches) setView('grid');
        desktopQuery.addEventListener('change', (event) => { if (event.matches) setView('grid'); });
    })();

    (function(){
        const btn = document.querySelector('.menu-toggle');
        const drawer = document.getElementById('mobileDrawer');
        const overlay = document.querySelector('.drawer-overlay');
    const closeBtn = document.querySelector('.drawer-close');
        const focusableSelectors = 'a, button';
        let lastFocused;
        function open(){
            lastFocused = document.activeElement;
            drawer.classList.add('open');
            overlay.hidden = false;
            document.body.classList.add('no-scroll');
            btn.setAttribute('aria-expanded','true');
            drawer.setAttribute('aria-hidden','false');
            const first = drawer.querySelector(focusableSelectors); first && first.focus();
            trapFocus(true);
        }
        function close(){
            drawer.classList.remove('open');
            overlay.hidden = true;
            document.body.classList.remove('no-scroll');
            btn.setAttribute('aria-expanded','false');
            drawer.setAttribute('aria-hidden','true');
            trapFocus(false);
            lastFocused && lastFocused.focus();
        }
        function toggle(){ drawer.classList.contains('open') ? close() : open(); }
        btn.addEventListener('click', toggle);
        overlay.addEventListener('click', close);
    closeBtn && closeBtn.addEventListener('click', close);
        window.addEventListener('keydown', e=>{ if(e.key==='Escape' && drawer.classList.contains('open')) close(); });
        function trapFocus(enable){
            if(!enable){ document.removeEventListener('focus', focusHandler, true); return; }
            document.addEventListener('focus', focusHandler, true);
        }
        function focusHandler(e){
            if(!drawer.classList.contains('open')) return;
            if(!drawer.contains(e.target) && e.target !== btn){
                const first = drawer.querySelector(focusableSelectors); first && first.focus();
            }
        }
    })();
    </script>
