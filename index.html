<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teton Construction</title>
  <link rel="stylesheet" href="Homepage/Homepage.css">
  <link rel="stylesheet" href="Assets/header.css">
</head>
<body class="home-page">
  <div id="preloader"><img src="Assets/teton-gif.gif" alt="Loading"></div>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="Teton Construction home"><img src="Assets/teton-header-white.png" alt="Teton Construction" class="brand-logo"></a>
      <nav class="main-nav" aria-label="Primary"><a class="active" href="index.html">Home</a><a href="Projects/Projects.html">Projects</a><a href="Contact/Contact.html">Contact</a></nav>
    </div>
  </header>
  <main class="landing-page">
    <section class="landing-ocean" aria-label="Ocean">
      <video id="landingVideo" muted autoplay loop playsinline webkit-playsinline preload="auto" poster="Assets/16.jpg"><source src="Assets/7031309_Close_up_Slow_Motion_3840x2160 (1).mp4" type="video/mp4"></video>
      <div class="landing-ocean-overlay" aria-hidden="true"></div>
      <div class="hero-content">
        <h1 class="landing-brand" id="landing-brand-title"><img src="Assets/teton-hero-logo-tm.png" alt="Teton"></h1>
        <nav class="hero-nav" aria-label="Homepage navigation">
          <a href="Projects/Projects.html">Projects</a>
          <a href="Contact/Contact.html">Contact</a>
        </nav>
      </div>
    </section>
  </main>
  <script>
    document.body.style.overflow = 'hidden';
    window.addEventListener('DOMContentLoaded', function() {
      const video = document.getElementById('landingVideo');
      const mediaReady = new Promise((resolve) => {
        if (!video || video.readyState >= 2) return resolve();
        video.addEventListener('loadeddata', resolve, { once: true });
        video.addEventListener('error', resolve, { once: true });
      });
      const minimumDisplay = new Promise((resolve) => setTimeout(resolve, 1100));
      const safetyTimeout = new Promise((resolve) => setTimeout(resolve, 5000));
      Promise.all([minimumDisplay, Promise.race([mediaReady, safetyTimeout])]).then(function() {
        const preloader = document.getElementById('preloader');
        preloader.classList.add('hide');
        document.body.classList.add('landing-ready');
        setTimeout(function(){ preloader.hidden = true; }, 700);
      });
    });
    (function(){
      const video = document.getElementById('landingVideo');
      if (!video) return;
      function playVideo(){ if (!document.hidden) { const promise = video.play(); if (promise && promise.catch) promise.catch(function(){}); } }
      video.addEventListener('pause', playVideo);
      video.addEventListener('ended', function(){ video.currentTime = 0; playVideo(); });
      document.addEventListener('visibilitychange', playVideo);
      playVideo();
    })();
  </script>
</body>
</html>
