<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teton Construction</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Homepage/Homepage.css" />
  <link rel="stylesheet" href="Assets/header.css" />
</head>
<body>
  <div id="preloader">
  <img src="Assets/teton-gif.gif" alt="Loading..." style="width:96px;height:auto;display:block;" />
  </div>
  <video class="video-bg" id="bgVideo" muted autoplay loop playsinline webkit-playsinline preload="auto" poster="Assets/85 Mountain View/16.jpg">
  <source src="Assets/7031309_Close_up_Slow_Motion_3840x2160 (1).mp4" type="video/mp4" />
    Your browser does not support the video tag.
  </video>
  <img class="video-fallback" src="Assets/video-fallback.jpg" alt="Background" style="display:none;" />
  <div class="video-overlay"></div>
  <button class="menu-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="mobileDrawer">
    <span></span>
    <span></span>
  </button>
  <div class="drawer-overlay" hidden></div>
  <aside id="mobileDrawer" class="mobile-drawer" aria-hidden="true">
    <button class="drawer-close" aria-label="Close menu"></button>
    <nav class="mobile-links" role="navigation" aria-label="Mobile Primary">
      <a href="index.html" aria-current="page">Home</a>
      <a href="Projects/Projects.html">Projects</a>
      <a href="Contact/Contact.html">Contact</a>
    </nav>
  </aside>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="Teton Construction home">
        <img src="Assets/TetonConstruction_Assets-2.png" alt="Teton Construction" class="brand-logo">
      </a>
      <nav class="main-nav" aria-label="Primary">
        <a class="active" href="index.html">Home</a>
        <a href="Projects/Projects.html">Projects</a>
        <a href="Contact/Contact.html">Contact</a>
      </nav>
    </div>
  </header>
  <div class="content">
    <div class="hero-stack">
      <div class="hero-brand">
        <div class="hero-logo-crop">
          <picture class="hero-logo-picture">
            <source srcset="Assets/TetonConstruction_Assets-2.png" media="(max-width:760px)">
            <img class="hero-logo" src="Assets/41a16fbe-dac6-4d23-b6ea-e9cb99b32397_removalai_preview.png" alt="Teton Construction Logo" />
          </picture>
        </div>
      </div>
      <nav class="main-links" aria-label="Primary links">
        <a href="Projects/Projects.html" title="View our projects">Projects</a>
        <a href="Contact/Contact.html" title="Get in touch">Contact</a>
      </nav>
    </div>
  </div>
  <script>
    // Preloader logic
    // Always show preloader for 2 seconds, then fade out
    document.body.style.overflow = 'hidden';
    window.addEventListener('DOMContentLoaded', function() {
      setTimeout(function() {
        var pre = document.getElementById('preloader');
        pre.classList.add('hide');
        document.body.style.overflow = '';
        window.dispatchEvent(new Event('home:ready'));
        setTimeout(function(){ pre.style.display = 'none'; }, 900);
      }, 1500);
    });
    // Ensure background video keeps playing on mobile (some browsers auto-pause inline autoplay videos)
    (function(){
      const v = document.getElementById('bgVideo');
      if(!v) return;
      function tryPlay(){
        if(v.paused || v.readyState < 2){
          const p = v.play();
          if(p && p.catch) p.catch(()=>{}); // ignore autoplay promise rejections
        }
      }
      // Resume if unexpectedly paused before end
      v.addEventListener('pause', ()=>{ if(!document.hidden && v.currentTime < (v.duration||1)-0.25) tryPlay(); });
      // Standard looping safety (some iOS versions fire ended before loop restarts)
      v.addEventListener('ended', ()=>{ v.currentTime = 0; tryPlay(); });
      ['loadeddata','canplay','canplaythrough','visibilitychange'].forEach(evt => {
        (evt==='visibilitychange'?document:v).addEventListener(evt, ()=>{ if(!document.hidden) tryPlay(); });
      });
      // Periodic nudge (low frequency to save battery)
      setInterval(()=>{ if(!document.hidden) tryPlay(); }, 5000);
      // Initial kick (in case preloader delayed)
      tryPlay();
    })();
    (function(){
      const desktop = window.matchMedia('(min-width: 761px)');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const root = document.documentElement;
      const hero = document.querySelector('.hero-stack');
      const video = document.querySelector('.video-bg');
      if (!hero || !video) return;

      let current = window.scrollY;
      let target = current;
      let enabled = false;
      let raf = 0;

      const clamp = (value, min, max) => Math.min(Math.max(value, min), max);

      function maxScroll() {
        return Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
      }

      function render() {
        const progress = maxScroll() ? clamp(current / maxScroll(), 0, 1) : 0;
        const exitProgress = clamp((progress - .48) / .52, 0, 1);
        root.style.setProperty('--home-hero-y', `${progress * window.innerHeight * -.58}px`);
        root.style.setProperty('--home-hero-opacity', String(1 - exitProgress * .82));
        root.style.setProperty('--home-video-y', `${progress * -36}px`);
        root.style.setProperty('--home-video-scale', String(1.015 + progress * .025));
        root.style.setProperty('--home-overlay-opacity', String(1 - progress * .2));
      }

      function tick() {
        if (!enabled) return;
        const difference = target - current;
        current += difference * .085;
        if (Math.abs(difference) < .1) current = target;
        window.scrollTo(0, current);
        render();
        raf = requestAnimationFrame(tick);
      }

      function onWheel(event) {
        if (!enabled || event.ctrlKey) return;
        event.preventDefault();
        const multiplier = event.deltaMode === 1 ? 18 : event.deltaMode === 2 ? window.innerHeight : 1;
        target = clamp(target + event.deltaY * multiplier, 0, maxScroll());
      }

      function onNativeScroll() {
        if (!enabled) return;
        if (Math.abs(window.scrollY - current) > 2) {
          current = window.scrollY;
          target = current;
          render();
        }
      }

      function start() {
        if (enabled || !desktop.matches || reducedMotion.matches) return;
        enabled = true;
        root.classList.add('home-smooth-scroll');
        current = target = window.scrollY;
        render();
        window.addEventListener('wheel', onWheel, { passive: false });
        window.addEventListener('scroll', onNativeScroll, { passive: true });
        raf = requestAnimationFrame(tick);
      }

      function stop() {
        if (!enabled) return;
        enabled = false;
        cancelAnimationFrame(raf);
        window.removeEventListener('wheel', onWheel);
        window.removeEventListener('scroll', onNativeScroll);
        root.classList.remove('home-smooth-scroll');
        root.style.removeProperty('--home-hero-y');
        root.style.removeProperty('--home-hero-opacity');
        root.style.removeProperty('--home-video-y');
        root.style.removeProperty('--home-video-scale');
        root.style.removeProperty('--home-overlay-opacity');
      }

      function sync() {
        if (desktop.matches && !reducedMotion.matches) start();
        else stop();
      }

      window.addEventListener('home:ready', sync, { once: true });
      desktop.addEventListener('change', sync);
      reducedMotion.addEventListener('change', sync);
    })();
    (function(){
      const btn=document.querySelector('.menu-toggle');
      const drawer=document.getElementById('mobileDrawer');
      const overlay=document.querySelector('.drawer-overlay');
      const closeBtn=drawer.querySelector('.drawer-close');
      const focusable='a, button';
      let last;
      function open(){
        last=document.activeElement;drawer.classList.add('open');overlay.hidden=false;document.body.classList.add('no-scroll');btn.setAttribute('aria-expanded','true');drawer.setAttribute('aria-hidden','false');const first=drawer.querySelector(focusable);first&&first.focus();trap(true);}
      function close(){
        drawer.classList.remove('open');overlay.hidden=true;document.body.classList.remove('no-scroll');btn.setAttribute('aria-expanded','false');drawer.setAttribute('aria-hidden','true');trap(false);last&&last.focus();}
      function toggle(){drawer.classList.contains('open')?close():open();}
      btn.addEventListener('click',toggle);overlay.addEventListener('click',close);closeBtn&&closeBtn.addEventListener('click',close);window.addEventListener('keydown',e=>{if(e.key==='Escape'&&drawer.classList.contains('open'))close();});
      function trap(en){if(!en){document.removeEventListener('focus',fh,true);return;}document.addEventListener('focus',fh,true);}function fh(e){if(!drawer.classList.contains('open'))return;if(!drawer.contains(e.target)&&e.target!==btn){const first=drawer.querySelector(focusable);first&&first.focus();}}
    })();
  </script>
</body>
</html>
