<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teton Construction</title>
  <link rel="stylesheet" href="Homepage/Homepage.css">
  <link rel="stylesheet" href="Assets/header.css">
</head>
<body class="home-page">
  <div id="preloader"><img src="Assets/teton-gif.gif" alt="Loading"></div>
  <button class="menu-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="mobileDrawer"><span></span><span></span></button>
  <div class="drawer-overlay" hidden></div>
  <aside id="mobileDrawer" class="mobile-drawer" aria-hidden="true">
    <button class="drawer-close" aria-label="Close menu"></button>
    <nav class="mobile-links" aria-label="Mobile Primary">
      <a href="index.html" aria-current="page">Home</a><a href="Projects/Projects.html">Projects</a><a href="Contact/Contact.html">Contact</a>
    </nav>
  </aside>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="Teton Construction home"><img src="Assets/TetonConstruction_Assets-2.png" alt="Teton Construction" class="brand-logo"></a>
      <nav class="main-nav" aria-label="Primary"><a class="active" href="index.html">Home</a><a href="Projects/Projects.html">Projects</a><a href="Contact/Contact.html">Contact</a></nav>
    </div>
  </header>
  <main class="landing-page">
    <section class="landing-ocean" aria-label="Ocean">
      <video id="landingVideo" muted autoplay loop playsinline webkit-playsinline preload="auto" poster="Assets/16.jpg"><source src="Assets/7031309_Close_up_Slow_Motion_3840x2160 (1).mp4" type="video/mp4"></video>
      <div class="landing-ocean-overlay" aria-hidden="true"></div>
    </section>
    <section class="landing-main" aria-labelledby="landing-brand-title">
      <h1 class="landing-brand" id="landing-brand-title">TETON</h1>
    </section>
  </main>
  <script>
    document.body.style.overflow = 'hidden';
    window.addEventListener('DOMContentLoaded', function() {
      const video = document.getElementById('landingVideo');
      const mediaReady = new Promise((resolve) => {
        if (!video || video.readyState >= 2) return resolve();
        video.addEventListener('loadeddata', resolve, { once: true });
        video.addEventListener('error', resolve, { once: true });
      });
      const minimumDisplay = new Promise((resolve) => setTimeout(resolve, 1100));
      const safetyTimeout = new Promise((resolve) => setTimeout(resolve, 5000));
      Promise.all([minimumDisplay, Promise.race([mediaReady, safetyTimeout])]).then(function() {
        const preloader = document.getElementById('preloader');
        preloader.classList.add('hide');
        document.body.classList.add('landing-ready');
        setTimeout(function(){ preloader.hidden = true; }, 700);
      });
    });
    (function(){
      const video = document.getElementById('landingVideo');
      if (!video) return;
      function playVideo(){ if (!document.hidden) { const promise = video.play(); if (promise && promise.catch) promise.catch(function(){}); } }
      video.addEventListener('pause', playVideo);
      video.addEventListener('ended', function(){ video.currentTime = 0; playVideo(); });
      document.addEventListener('visibilitychange', playVideo);
      playVideo();
    })();
    (function(){
      const button = document.querySelector('.menu-toggle');
      const drawer = document.getElementById('mobileDrawer');
      const overlay = document.querySelector('.drawer-overlay');
      const closeButton = document.querySelector('.drawer-close');
      let lastFocused;
      function open(){ lastFocused=document.activeElement;drawer.classList.add('open');overlay.hidden=false;button.setAttribute('aria-expanded','true');drawer.setAttribute('aria-hidden','false');const first=drawer.querySelector('a, button');if(first)first.focus(); }
      function close(){ drawer.classList.remove('open');overlay.hidden=true;button.setAttribute('aria-expanded','false');drawer.setAttribute('aria-hidden','true');if(lastFocused)lastFocused.focus(); }
      button.addEventListener('click',function(){drawer.classList.contains('open')?close():open();});overlay.addEventListener('click',close);closeButton.addEventListener('click',close);window.addEventListener('keydown',function(event){if(event.key==='Escape')close();});
    })();
  </script>
</body>
</html>
