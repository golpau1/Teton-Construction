<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teton Construction</title>
  <link rel="stylesheet" href="Homepage/Homepage.css">
  <link rel="stylesheet" href="Assets/header.css">
  <link rel="stylesheet" href="Assets/preloader.css">
  <script src="Assets/preloader.js" defer></script>
</head>
<body class="home-page site-loading">
  <div class="site-preloader" role="status" aria-label="Loading page"><img src="Assets/teton-gif.gif" alt="Teton Construction loading"></div>
  <div class="drawer-overlay" hidden></div>
  <aside id="mobileDrawer" class="mobile-drawer" aria-hidden="true">
    <button class="drawer-close" aria-label="Close menu"></button>
    <nav class="mobile-links" aria-label="Mobile Primary">
      <a href="index.html">Home</a>
      <a href="Projects/Projects.html#projects">Projects</a>
      <a href="Projects/Projects.html#contact">Contact</a>
    </nav>
  </aside>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="Teton Construction home"><img src="Assets/teton-header-logo.png" alt="Teton Construction" class="brand-logo brand-logo--light"></a>
      <button class="menu-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="mobileDrawer"><span></span><span></span></button>
      <nav class="main-nav" aria-label="Primary"><a class="active" href="index.html">Home</a><a href="Projects/Projects.html#projects">Projects</a><a href="Projects/Projects.html#contact">Contact</a></nav>
    </div>
  </header>
  <main class="landing-page">
    <section class="landing-ocean" aria-label="Ocean">
      <video id="landingVideo" autoplay muted playsinline webkit-playsinline loop preload="auto"><source src="Assets/7031309_Close_up_Slow_Motion_3840x2160 (1).mp4" type="video/mp4"></video>
      <div class="landing-ocean-overlay" aria-hidden="true"></div>
      <div class="hero-content">
        <h1 class="landing-brand" id="landing-brand-title">
          <img class="landing-brand-glow" src="Assets/teton-hero-logo-tm.png" alt="" aria-hidden="true">
          <img class="landing-brand-mark" src="Assets/teton-hero-logo-tm.png" alt="Teton">
        </h1>
        <nav class="hero-nav" aria-label="Homepage navigation">
          <a href="Projects/Projects.html#projects">Projects</a>
          <a href="Projects/Projects.html#contact">Contact</a>
        </nav>
      </div>
    </section>
  </main>
  <script>
    window.addEventListener('sitepreloader:complete', function() {
      document.body.classList.add('landing-ready');
    });
    (function() {
      const button = document.querySelector('.menu-toggle');
      const drawer = document.getElementById('mobileDrawer');
      const overlay = document.querySelector('.drawer-overlay');
      const closeButton = document.querySelector('.drawer-close');
      if (!button || !drawer || !overlay || !closeButton) return;

      function closeMenu() {
        drawer.classList.remove('open');
        overlay.hidden = true;
        document.body.classList.remove('no-scroll');
        button.setAttribute('aria-expanded', 'false');
        drawer.setAttribute('aria-hidden', 'true');
      }

      button.addEventListener('click', function() {
        drawer.classList.add('open');
        overlay.hidden = false;
        document.body.classList.add('no-scroll');
        button.setAttribute('aria-expanded', 'true');
        drawer.setAttribute('aria-hidden', 'false');
        closeButton.focus();
      });
      closeButton.addEventListener('click', closeMenu);
      overlay.addEventListener('click', closeMenu);
      document.addEventListener('keydown', function(event) {
        if (event.key === 'Escape') closeMenu();
      });
    })();
  </script>
</body>
</html>
